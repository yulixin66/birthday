<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ 生日快乐 ✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1a;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: white;
            user-select: none;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 16px;
            z-index: 50;
        }

        /* 开篇信封 */
        #envelope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(10px);
            transition: opacity 1.2s ease;
            pointer-events: none;
        }
        #envelope-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #envelope {
            width: 280px;
            height: 180px;
            perspective: 800px;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.4s ease;
        }
        #envelope:hover {
            transform: scale(1.03);
        }
        .envelope-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .envelope-front,
        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ff9bcb, #ff6b9d);
            box-shadow: 0 0 60px rgba(255, 150, 200, 0.3);
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .envelope-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #ffd700, #ff9bcb);
        }
        .envelope-front .icon {
            font-size: 60px;
            margin-bottom: 8px;
        }
        .envelope-front h1 {
            font-size: 22px;
            margin: 0;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }
        .envelope-front p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 6px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .envelope-back h2 {
            font-size: 28px;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }
        .envelope-back p {
            font-size: 16px;
            opacity: 0.95;
            margin-top: 6px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .envelope-back .sub {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 10px;
            color: #fff;
        }

        /* UI控件 */
        #ui {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        #blow-btn {
            pointer-events: auto;
            padding: 12px 36px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffb3d9;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255, 150, 200, 0.2);
            display: none;
            transform: scale(0.8);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
            text-shadow: 0 0 20px rgba(255, 180, 220, 0.5);
            touch-action: manipulation;
        }
        #blow-btn.show {
            display: inline-block;
            transform: scale(1);
        }
        #blow-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05) !important;
        }

        #message {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            font-size: min(6vw, 36px);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
            z-index: 30;
            text-align: center;
            line-height: 1.6;
            width: 90%;
        }
        #message.show {
            opacity: 1;
        }
        #message .sub {
            font-size: min(2.5vw, 18px);
            color: #ffb3d9;
            display: block;
            margin-top: 6px;
            font-weight: normal;
            text-shadow: 0 0 30px rgba(255, 180, 220, 0.9);
        }

        #hint {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffb3d9;
            font-size: 14px;
            z-index: 15;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 30px rgba(255, 180, 220, 0.5);
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        #hint.show {
            opacity: 1;
            animation: pulse 2s infinite;
        }
        #hint.highlight {
            color: #ff9bcb;
            font-size: 22px;
            text-shadow: 0 0 40px rgba(255, 155, 203, 0.9), 0 0 80px rgba(255, 155, 203, 0.5);
            opacity: 1;
            animation: glowPink 1.5s ease-in-out infinite alternate;
            letter-spacing: 2px;
            background: rgba(10, 10, 26, 0.3);
            padding: 10px 30px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 155, 203, 0.2);
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.9; }
            100% { opacity: 0.4; }
        }
        @keyframes glowPink {
            0% { text-shadow: 0 0 30px rgba(255, 155, 203, 0.6); }
            100% { text-shadow: 0 0 60px rgba(255, 155, 203, 1), 0 0 120px rgba(255, 155, 203, 0.6); }
        }

        #music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            user-select: none;
            pointer-events: auto;
        }
        #music-control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        #scene-container {
            display: none;
            width: 100%;
            height: 100%;
        }
        #scene-container.active {
            display: block;
        }
    </style>
</head>
<body>

    <div id="loading">🎂 加载中 ...</div>

    <div id="envelope-overlay">
        <div id="envelope" onclick="openEnvelope()">
            <div class="envelope-inner">
                <div class="envelope-front">
                    <div class="icon">💌</div>
                    <h1>一份特别的邀请</h1>
                    <p>点击打开</p>
                </div>
                <div class="envelope-back">
                    <h2>✨ovo✨</h2>
                    <p>oi 准备好接受惊喜了吗？</p>
                    <div class="sub">💖 点击进入 💖</div>
                </div>
            </div>
        </div>
    </div>

    <div id="scene-container">
        <div id="message">
            <span id="msg-text"></span>
            <span class="sub" id="msg-sub"></span>
        </div>
        <div id="hint"></div>
        <div id="ui">
            <button id="blow-btn">🎂许愿吹蜡烛吧！</button>
        </div>
        <div id="music-control" onclick="toggleMusic()">🔇</div>
        <audio id="bgm" loop preload="auto">
            <source src="https://music.163.com/song/media/outer/url?id=1881615952.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 14);
        camera.lookAt(0, 2.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('scene-container').appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('scene-container').appendChild(labelRenderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2.2, 0);
        controls.minDistance = 5;
        controls.maxDistance = 22;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.update();

        // --- 灯光 ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(5, 12, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fill = new THREE.DirectionalLight(0x4466ff, 0.3);
        fill.position.set(-6, 4, -5);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xff99cc, 0.5);
        rim.position.set(0, -1, 10);
        scene.add(rim);

        // --- 星星 ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const pos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            const r = 40 + Math.random() * 70;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            pos[i] = r * Math.sin(phi) * Math.cos(theta);
            pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i+2] = r * Math.cos(phi);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- 花瓣 (150片) ---
        const petalCount = 150;
        const petalGeo = new THREE.BufferGeometry();
        const petalPos = new Float32Array(petalCount * 3);
        const petalData = [];
        for (let i = 0; i < petalCount; i++) {
            petalPos[i*3] = (Math.random() - 0.5) * 50;
            petalPos[i*3+1] = Math.random() * 20;
            petalPos[i*3+2] = (Math.random() - 0.5) * 30;
            petalData.push({
                speedY: 0.006 + Math.random() * 0.02,
                speedX: (Math.random() - 0.5) * 0.006,
                phase: Math.random() * Math.PI * 2
            });
        }
        petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));
        const petalMat = new THREE.PointsMaterial({
            color: 0xff9bcb,
            size: 0.3,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            map: (() => {
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const grd = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                grd.addColorStop(0, 'rgba(255,255,255,1)');
                grd.addColorStop(1, 'rgba(255,200,200,0)');
                ctx.fillStyle = grd;
                ctx.fillRect(0,0,32,32);
                return new THREE.CanvasTexture(canvas);
            })()
        });
        const petals = new THREE.Points(petalGeo, petalMat);
        scene.add(petals);

        // --- 流星系统 ---
        const meteorGroup = new THREE.Group();
        scene.add(meteorGroup);
        const METEOR_COUNT = 8;
        const TAIL_LENGTH = 15;
        const meteors = [];

        function createGlowTexture(color = '#ffffff', size = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.1, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.4, 'rgba(255,200,220,0.5)');
            gradient.addColorStop(1, 'rgba(255,150,200,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        const glowTexture = createGlowTexture();

        for (let i = 0; i < METEOR_COUNT; i++) {
            const startX = (Math.random() - 0.5) * 50;
            const startY = 5 + Math.random() * 20;
            const startZ = (Math.random() - 0.5) * 25;
            const angle = Math.random() * Math.PI * 0.3 + 0.2;
            const speed = 0.06 + Math.random() * 0.12;
            const dirX = -Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -1);
            const dirY = -Math.sin(angle) * speed * (0.6 + Math.random() * 0.4);
            const dirZ = (Math.random() - 0.5) * 0.015;

            const hue = 0.92 + Math.random() * 0.08;
            const color = new THREE.Color().setHSL(hue, 0.6, 0.6 + Math.random() * 0.3);

            const particleCount = TAIL_LENGTH;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const alphas = new Float32Array(particleCount);

            for (let j = 0; j < particleCount; j++) {
                const progress = j / particleCount;
                positions[j*3] = startX;
                positions[j*3+1] = startY;
                positions[j*3+2] = startZ;
                const c = color.clone();
                c.multiplyScalar(1 - progress * 0.6);
                colors[j*3] = c.r;
                colors[j*3+1] = c.g;
                colors[j*3+2] = c.b;
                sizes[j] = (1 - progress * 0.9) * 0.4 + 0.05;
                alphas[j] = (1 - progress * 0.9);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.5,
                map: glowTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true,
                sizeAttenuation: true,
            });

            const particles = new THREE.Points(geo, mat);
            meteorGroup.add(particles);

            meteors.push({
                particles,
                positions: geo.attributes.position.array,
                colors: geo.attributes.color.array,
                sizes: geo.attributes.size.array,
                alphas: geo.attributes.alpha.array,
                geo,
                startX, startY, startZ,
                dirX, dirY, dirZ,
                speed,
                life: Math.random() * 300,
                maxLife: 150 + Math.random() * 200,
                color: color,
                active: true
            });
        }

        function updateMeteors(time) {
            for (const m of meteors) {
                m.life += 1;
                if (m.life > m.maxLife) {
                    m.startX = (Math.random() - 0.5) * 50;
                    m.startY = 5 + Math.random() * 20;
                    m.startZ = (Math.random() - 0.5) * 25;
                    const angle = Math.random() * Math.PI * 0.3 + 0.2;
                    const speed = 0.06 + Math.random() * 0.12;
                    m.dirX = -Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -1);
                    m.dirY = -Math.sin(angle) * speed * (0.6 + Math.random() * 0.4);
                    m.dirZ = (Math.random() - 0.5) * 0.015;
                    m.life = 0;
                    m.maxLife = 150 + Math.random() * 200;
                    const hue = 0.92 + Math.random() * 0.08;
                    m.color.setHSL(hue, 0.6, 0.6 + Math.random() * 0.3);
                }

                const progress = m.life / m.maxLife;
                const positions = m.positions;
                const colors = m.colors;
                const sizes = m.sizes;
                const alphas = m.alphas;
                const count = positions.length / 3;

                for (let j = 0; j < count; j++) {
                    const t = j / count;
                    const past = t * 0.6;
                    const px = m.startX + m.dirX * Math.max(0, progress - past) * 120;
                    const py = m.startY + m.dirY * Math.max(0, progress - past) * 120;
                    const pz = m.startZ + m.dirZ * Math.max(0, progress - past) * 120;
                    positions[j*3] = px;
                    positions[j*3+1] = py;
                    positions[j*3+2] = pz;

                    const fade = 1 - t * 0.8;
                    const c = m.color.clone();
                    c.multiplyScalar(0.3 + 0.7 * fade);
                    if (t < 0.15) {
                        const white = 1 - t / 0.15;
                        c.r = Math.min(1, c.r + white * 0.5);
                        c.g = Math.min(1, c.g + white * 0.4);
                        c.b = Math.min(1, c.b + white * 0.6);
                    }
                    colors[j*3] = c.r;
                    colors[j*3+1] = c.g;
                    colors[j*3+2] = c.b;

                    sizes[j] = (1 - t * 0.85) * 0.5 + 0.05;
                    alphas[j] = Math.max(0, (1 - t * 0.8)) * (0.8 + 0.2 * Math.sin(time + j));
                }

                m.geo.attributes.position.needsUpdate = true;
                m.geo.attributes.color.needsUpdate = true;
                m.geo.attributes.size.needsUpdate = true;
                m.geo.attributes.alpha.needsUpdate = true;
            }
        }

        // --- 加载多张照片（6张不同） ---
        const textureLoader = new THREE.TextureLoader();
        // 备用纹理（用于加载失败时）
        const fallbackCanvas = document.createElement('canvas');
        fallbackCanvas.width = 256;
        fallbackCanvas.height = 256;
        const ctx = fallbackCanvas.getContext('2d');
        ctx.clearRect(0, 0, 256, 256);
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 3;
        ctx.strokeRect(20, 20, 216, 216);
        ctx.fillStyle = '#666';
        ctx.font = '60px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📸', 128, 130);
        ctx.fillStyle = '#999';
        ctx.font = '20px sans-serif';
        ctx.fillText('加载失败', 128, 200);
        const fallbackTexture = new THREE.CanvasTexture(fallbackCanvas);

        // 照片文件名列表（请确保这些文件存在，且为 .jpg 格式）
        const photoFiles = ['her.jpg', 'her1.jpg', 'her2.jpg', 'her3.jpg', 'her4.jpg', 'her5.jpg'];
        const photoTextures = [];

        for (let i = 0; i < photoFiles.length; i++) {
            const file = photoFiles[i];
            const tex = textureLoader.load(file,
                () => console.log(`✅ ${file} 加载成功`),
                undefined,
                (err) => {
                    console.warn(`⚠️ ${file} 加载失败，使用备用`, err);
                    // 将当前纹理替换为备用纹理内容
                    tex.image = fallbackTexture.image;
                    tex.needsUpdate = true;
                }
            );
            photoTextures.push(tex);
        }

        // --- 照片墙（6个位置，分别使用不同照片） ---
        const photoGroup = new THREE.Group();
        const photoCount = 6;
        const photoRadius = 4.2;
        const photoW = 1.8;
        const photoH = 2.2;

        for (let i = 0; i < photoCount; i++) {
            const angle = (i / photoCount) * Math.PI * 2;
            const x = Math.sin(angle) * photoRadius;
            const z = Math.cos(angle) * photoRadius;

            const mat = new THREE.MeshStandardMaterial({
                map: photoTextures[i], // 使用不同的纹理
                side: THREE.DoubleSide,
                roughness: 0.15,
                metalness: 0.05,
                transparent: true,
                opacity: 0.0,
            });
            const geo = new THREE.PlaneGeometry(photoW, photoH);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 2.4 + Math.sin(angle * 2) * 0.2, z);
            mesh.lookAt(0, 2.4, 0);
            mesh.castShadow = true;
            photoGroup.add(mesh);
        }
        scene.add(photoGroup);

        // --- 心形粒子 ---
        const heartCount = 500;
        const heartGeo2 = new THREE.BufferGeometry();
        const heartPos2 = new Float32Array(heartCount * 3);
        const heartColors2 = new Float32Array(heartCount * 3);
        const heartSizes2 = new Float32Array(heartCount);
        const origHeartPos2 = [];

        for (let i = 0; i < heartCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const scale = 0.6 + Math.random() * 0.6;
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
            const z = (Math.random() - 0.5) * 3 * scale;
            const fx = x * 0.35;
            const fy = y * 0.35 + 1.8;
            const fz = z * 0.35;
            heartPos2[i*3] = fx;
            heartPos2[i*3+1] = fy;
            heartPos2[i*3+2] = fz;
            origHeartPos2.push({ x: fx, y: fy, z: fz });

            const mix = Math.random();
            const r = 255;
            const g = 80 + 175 * (1 - mix);
            const b = 80 + 175 * mix * 0.6;
            heartColors2[i*3] = r / 255;
            heartColors2[i*3+1] = g / 255;
            heartColors2[i*3+2] = b / 255;
            heartSizes2[i] = 0.15 + Math.random() * 0.3;
        }
        heartGeo2.setAttribute('position', new THREE.BufferAttribute(heartPos2, 3));
        heartGeo2.setAttribute('color', new THREE.BufferAttribute(heartColors2, 3));
        heartGeo2.setAttribute('size', new THREE.BufferAttribute(heartSizes2, 1));

        const heartMat2 = new THREE.PointsMaterial({
            size: 0.45,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const heartParticles2 = new THREE.Points(heartGeo2, heartMat2);
        heartParticles2.position.set(0, 0, 0);
        scene.add(heartParticles2);
        const heartPosAttr2 = heartGeo2.attributes.position;

        // --- 蛋糕 ---
        const cakeGroup = new THREE.Group();
        const baseMat = new THREE.MeshStandardMaterial({ color: 0xff6b8a, roughness: 0.3 });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 0.35, 24), baseMat);
        base.position.y = 0.175;
        base.castShadow = true;
        cakeGroup.add(base);

        const midMat = new THREE.MeshStandardMaterial({ color: 0xff8fab, roughness: 0.3 });
        const mid = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.4, 0.4, 24), midMat);
        mid.position.y = 0.55;
        mid.castShadow = true;
        cakeGroup.add(mid);

        const topMat = new THREE.MeshStandardMaterial({ color: 0xffa5b9, roughness: 0.3 });
        const top = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.1, 0.4, 24), topMat);
        top.position.y = 0.95;
        top.castShadow = true;
        cakeGroup.add(top);

        const creamMat = new THREE.MeshStandardMaterial({ color: 0xfff5f0, roughness: 0.5 });
        const cream = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.15, 0.08, 24), creamMat);
        cream.position.y = 1.18;
        cakeGroup.add(cream);

        const candleMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d });
        const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.45, 8), candleMat);
        candle.position.y = 1.45;
        candle.castShadow = true;
        cakeGroup.add(candle);

        // 火焰
        const flameGroup = new THREE.Group();
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true });
        const flame = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.12, 6), flameMat);
        flame.position.y = 0.08;
        flameGroup.add(flame);
        const flameInner = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.07, 6),
            new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true })
        );
        flameInner.position.y = 0.08;
        flameGroup.add(flameInner);
        const glowSprite2 = new THREE.Sprite(new THREE.SpriteMaterial({
            map: (() => {
                const c = document.createElement('canvas');
                c.width = 64; c.height = 64;
                const ctx = c.getContext('2d');
                const grad = ctx.createRadialGradient(32,32,0,32,32,32);
                grad.addColorStop(0, 'rgba(255,200,100,1)');
                grad.addColorStop(0.3, 'rgba(255,150,50,0.6)');
                grad.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,64,64);
                return new THREE.CanvasTexture(c);
            })(),
            transparent: true,
            blending: THREE.AdditiveBlending,
        }));
        glowSprite2.scale.set(0.35, 0.35, 1);
        flameGroup.add(glowSprite2);
        flameGroup.position.set(0, 1.7, 0);
        cakeGroup.add(flameGroup);

        cakeGroup.position.set(0, -0.1, 0);
        scene.add(cakeGroup);

        // 地面光晕
        const floorGlow = new THREE.Mesh(
            new THREE.CircleGeometry(2.0, 16),
            new THREE.MeshBasicMaterial({ color: 0xff6b9d, transparent: true, opacity: 0.06, side: THREE.DoubleSide })
        );
        floorGlow.rotation.x = -Math.PI / 2;
        floorGlow.position.y = 0.01;
        scene.add(floorGlow);

        // --- 烟花 ---
        let fireworks = [];
        function createFirework(x, y, z) {
            const colors = [0xff6b9d, 0xffd700, 0xff3b7d, 0x66ccff, 0xffaa00];
            for (let i = 0; i < 100; i++) {
                const size = 0.04 + Math.random() * 0.1;
                const ang1 = Math.random() * Math.PI * 2;
                const ang2 = Math.random() * Math.PI * 2;
                const speed = 0.03 + Math.random() * 0.1;
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(size, 3, 3),
                    new THREE.MeshBasicMaterial({
                        color: colors[Math.floor(Math.random() * colors.length)],
                        transparent: true
                    })
                );
                mesh.position.set(x, y, z);
                scene.add(mesh);
                fireworks.push({
                    mesh,
                    vx: Math.cos(ang1) * Math.sin(ang2) * speed,
                    vy: Math.sin(ang1) * speed * 0.8 + 0.02,
                    vz: Math.cos(ang2) * Math.sin(ang1) * speed,
                    life: 1.0,
                    decay: 0.005 + Math.random() * 0.008,
                    gravity: 0.0015
                });
            }
        }

        // --- 烟雾 ---
        let smokeParticles = [];
        function createSmoke() {
            for (let i = 0; i < 25; i++) {
                const size = 0.05 + Math.random() * 0.1;
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(size, 4, 4),
                    new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.3 })
                );
                mesh.position.set((Math.random()-0.5)*0.3, 1.85+Math.random()*0.2, (Math.random()-0.5)*0.3);
                scene.add(mesh);
                smokeParticles.push({
                    mesh,
                    vx: (Math.random()-0.5)*0.015,
                    vy: 0.01 + Math.random()*0.015,
                    vz: (Math.random()-0.5)*0.015,
                    life: 1.0,
                    decay: 0.005 + Math.random()*0.005
                });
            }
        }

        // --- 交互控制 ---
        let candleLit = true;
        let blown = false;
        let sceneActive = false;

        const blowBtn = document.getElementById('blow-btn');
        const msgText = document.getElementById('msg-text');
        const msgSub = document.getElementById('msg-sub');
        const messageEl = document.getElementById('message');
        const hintEl = document.getElementById('hint');
        const sceneContainer = document.getElementById('scene-container');

        // --- 辅助：显示提示 ---
        function showHint(text, isHighlight = false, duration = 0) {
            hintEl.textContent = text;
            hintEl.className = '';
            if (isHighlight) {
                hintEl.classList.add('highlight');
            } else {
                hintEl.classList.add('show');
            }
            if (duration > 0) {
                clearTimeout(hintEl._timer);
                hintEl._timer = setTimeout(() => {
                    hintEl.className = '';
                    hintEl.textContent = '';
                }, duration);
            }
        }

        // --- 打开信封 ---
        window.openEnvelope = function() {
            const envelope = document.getElementById('envelope');
            const overlay = document.getElementById('envelope-overlay');
            envelope.querySelector('.envelope-inner').style.transform = 'rotateY(180deg)';

            setTimeout(() => {
                overlay.classList.add('hidden');
                sceneContainer.classList.add('active');
                sceneActive = true;

                const bgm = document.getElementById('bgm');
                if (bgm.paused) {
                    bgm.volume = 0.3;
                    bgm.play().then(() => {
                        document.getElementById('music-control').textContent = '🔊';
                    }).catch(() => {});
                }

                showHint('💡 点击蛋糕，许个愿吧', false, 0);

                // 照片淡入
                photoGroup.children.forEach(child => {
                    if (child.isMesh && child.material && child.material.opacity !== undefined) {
                        child.material.opacity = 0;
                        const fade = setInterval(() => {
                            child.material.opacity = Math.min(0.95, child.material.opacity + 0.05);
                            if (child.material.opacity >= 0.95) clearInterval(fade);
                        }, 20);
                    }
                });

                controls.target.set(0, 2.2, 0);
                controls.update();
            }, 600);
        };

        // --- 点击蛋糕检测 ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function onPointerDown(event) {
            if (!sceneActive) return;

            let clientX, clientY;
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
                event.preventDefault();
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((clientY - rect.top) / rect.height) * 2 + 1;

            pointer.set(x, y);
            raycaster.setFromCamera(pointer, camera);

            const intersects = raycaster.intersectObjects(cakeGroup.children, true);
            if (intersects.length > 0 && candleLit && !blown) {
                blowBtn.classList.add('show');
                showHint('🎂 点击“吹蜡烛”按钮！', false, 0);

                requestAnimationFrame(() => {
                    cakeGroup.position.y = -0.1;
                    setTimeout(() => cakeGroup.position.y = -0.1, 150);

                    for (let i = 0; i < 10; i++) {
                        const crumb = new THREE.Mesh(
                            new THREE.SphereGeometry(0.02 + Math.random() * 0.03, 3, 3),
                            new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0x8B4513 : 0xD2691E })
                        );
                        crumb.position.set(
                            (Math.random() - 0.5) * 0.6,
                            1.4 + Math.random() * 0.3,
                            (Math.random() - 0.5) * 0.6
                        );
                        scene.add(crumb);
                        const ang = Math.random() * Math.PI * 2;
                        const spd = 0.02 + Math.random() * 0.04;
                        crumb.userData = {
                            vx: Math.cos(ang) * spd,
                            vy: 0.01 + Math.random() * 0.02,
                            vz: Math.sin(ang) * spd
                        };
                        setTimeout(() => scene.remove(crumb), 800);
                    }
                });
            }
        }

        renderer.domElement.addEventListener('click', onPointerDown);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });

        // --- 吹蜡烛按钮 ---
        function onBlowClick(event) {
            if (event.type === 'touchstart') {
                event.preventDefault();
            }
            if (!candleLit || blown) return;
            blown = true;
            candleLit = false;
            blowBtn.classList.remove('show');

            showHint('🎉 许个愿吧！', false, 1500);

            const shrink = setInterval(() => {
                flameGroup.scale.multiplyScalar(0.95);
                flameGroup.children.forEach(c => {
                    if (c.material) c.material.opacity *= 0.95;
                });
                if (flameGroup.scale.x < 0.05) {
                    clearInterval(shrink);
                    flameGroup.visible = false;
                    createSmoke();
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => createFirework(
                            (Math.random()-0.5)*4, 2+Math.random()*2, (Math.random()-0.5)*4
                        ), i*400);
                    }
                    setTimeout(() => {
                        const full = '✨ 李卓研22岁生日快乐！ ✨';
                        const sub = '我希望你开心快乐，幸福美满，越来越好，最后祝你生日快乐！';
                        let idx = 0;
                        msgText.textContent = '';
                        msgSub.textContent = '';
                        messageEl.classList.add('show');
                        const interval = setInterval(() => {
                            if (idx < full.length) {
                                msgText.textContent += full[idx];
                                idx++;
                            } else {
                                clearInterval(interval);
                                setTimeout(() => {
                                    msgSub.textContent = sub;
                                    const positions = heartPosAttr2.array;
                                    for (let i = 0; i < positions.length; i+=3) {
                                        positions[i] += (Math.random()-0.5)*3;
                                        positions[i+1] += (Math.random()-0.5)*3;
                                        positions[i+2] += (Math.random()-0.5)*3;
                                    }
                                    heartPosAttr2.needsUpdate = true;
                                    for (let i = 0; i < 4; i++) {
                                        setTimeout(() => createFirework(
                                            (Math.random()-0.5)*5, 1.5+Math.random()*3, (Math.random()-0.5)*5
                                        ), i*250);
                                    }
                                    showHint('💖 生日快乐，李卓研！', true, 0);
                                    setTimeout(() => {
                                        const positions2 = heartPosAttr2.array;
                                        for (let i = 0; i < origHeartPos2.length; i++) {
                                            positions2[i*3] = origHeartPos2[i].x;
                                            positions2[i*3+1] = origHeartPos2[i].y;
                                            positions2[i*3+2] = origHeartPos2[i].z;
                                        }
                                        heartPosAttr2.needsUpdate = true;
                                        heartMat2.color.setHex(0xffd700);
                                    }, 2500);
                                }, 400);
                            }
                        }, 130);
                    }, 600);
                }
            }, 30);
        }

        blowBtn.addEventListener('click', onBlowClick);
        blowBtn.addEventListener('touchstart', onBlowClick, { passive: false });

        // --- 音乐 ---
        window.toggleMusic = function() {
            const bgm = document.getElementById('bgm');
            const btn = document.getElementById('music-control');
            if (bgm.paused) {
                bgm.volume = 0.3;
                bgm.play().then(() => btn.textContent = '🔊').catch(()=>{});
            } else {
                bgm.pause();
                btn.textContent = '🔇';
            }
        };

        // --- 动画循环 ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            stars.rotation.y += 0.0002;
            heartParticles2.rotation.y += 0.006;
            photoGroup.rotation.y += 0.005;

            photoGroup.children.forEach((child, index) => {
                if (child.isMesh && child.geometry.type === 'PlaneGeometry') {
                    child.position.y += Math.sin(time * 0.5 + index) * 0.001;
                }
            });

            if (candleLit) {
                const flicker = 0.03 * Math.sin(time*25) + 0.02 * Math.sin(time*40+1);
                flameGroup.position.y = 1.7 + flicker;
                flameGroup.scale.set(
                    1 + 0.03 * Math.sin(time*22),
                    1 + 0.05 * Math.sin(time*30+0.5),
                    1 + 0.03 * Math.sin(time*26+1)
                );
                glowSprite2.scale.set(
                    0.3 + 0.07 * Math.sin(time*18),
                    0.3 + 0.07 * Math.sin(time*18+1),
                    1
                );
            }

            const pPos = petals.geometry.attributes.position.array;
            for (let i = 0; i < petalCount; i++) {
                pPos[i*3+1] -= petalData[i].speedY;
                pPos[i*3] += petalData[i].speedX;
                if (pPos[i*3+1] < -5) {
                    pPos[i*3] = (Math.random()-0.5)*50;
                    pPos[i*3+1] = 18 + Math.random()*5;
                    pPos[i*3+2] = (Math.random()-0.5)*30;
                }
            }
            petals.geometry.attributes.position.needsUpdate = true;

            updateMeteors(time);

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const f = fireworks[i];
                f.mesh.position.x += f.vx;
                f.mesh.position.y += f.vy;
                f.mesh.position.z += f.vz;
                f.vy -= f.gravity;
                f.life -= f.decay;
                f.mesh.material.opacity = f.life;
                if (f.life <= 0) { scene.remove(f.mesh); fireworks.splice(i,1); }
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const s = smokeParticles[i];
                s.mesh.position.x += s.vx;
                s.mesh.position.y += s.vy;
                s.mesh.position.z += s.vz;
                s.mesh.scale.multiplyScalar(1.01);
                s.life -= s.decay;
                s.mesh.material.opacity = s.life * 0.5;
                if (s.life <= 0) { scene.remove(s.mesh); smokeParticles.splice(i,1); }
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🎂 卓研，22岁生日快乐！');
    </script>
</body>
</html>
